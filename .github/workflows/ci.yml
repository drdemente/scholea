name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job here needs a secret or a repository variable, so pull requests from
# forks run exactly the same checks.
permissions:
  contents: read

jobs:
  web:
    name: Web app (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # No VITE_SUPABASE_* value is set, so this is the guest-only app: no
      # account screens and no backend. Forks build it the same way.
      - name: Build the guest-only app (no account settings)
        run: pnpm build
      - name: The guest build holds no backend address and no key
        run: |
          # A secret or publishable key, a legacy JWT key, a hosted project
          # address, or the address of the local stack.
          leak='sb_secret_[A-Za-z0-9_-]{16,}|sb_publishable_[A-Za-z0-9_-]{16,}|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.|https://[a-z0-9]{20}\.supabase\.co|127\.0\.0\.1:5632[0-9]'
          # Without this, a build that wrote its files somewhere else would
          # leave nothing to search, and finding nothing would look like a pass.
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html is missing, so there is no guest build to check."
            exit 1
          fi
          if grep -rIlE "$leak" dist; then
            echo "::error::The guest build contains a backend address or a key, in the files listed above."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

      # The same code with account settings present. The values are
      # placeholders, and a build contacts nothing.
      - name: Build again with placeholder account settings
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: pnpm exec vite build --outDir dist-accounts
      - name: The account build carries the address it was given, and no secret key
        run: |
          if ! grep -rq 'ci-placeholder\.invalid' dist-accounts; then
            echo "::error::The account settings given to the build are not in the bundle."
            exit 1
          fi
          if grep -rIlE 'sb_secret_[A-Za-z0-9_-]{16,}' dist-accounts; then
            echo "::error::The account build contains a secret key, in the files listed above."
            exit 1
          fi

      # The app has no administration screens: whoever runs an instance calls
      # the backend's admin functions from a tool of their own. The names of
      # those functions are read from the migrations that define them, so a
      # new one is covered without touching this step. Source maps are
      # searched too, and they hold the source text and its comments.
      - name: Neither build holds an administration screen or a call to an admin function
        run: |
          names="$(grep -rhoiE 'function[[:space:]]+public\.(admin|master)_[a-z0-9_]+' supabase/migrations | sed -E 's/.*public\.//' | tr 'A-Z' 'a-z' | sort -u | paste -sd'|' -)"
          if [ -z "$names" ]; then
            echo "::error::No admin function was found in supabase/migrations, so there is nothing to search the builds for."
            exit 1
          fi
          for d in dist dist-accounts; do
            if [ ! -f "$d/index.html" ]; then
              echo "::error::$d/index.html is missing, so there is no build to check."
              exit 1
            fi
          done
          if grep -rIlE "Administrator sign-in|Invite user|Audit log|functions/v1/admin|\b($names)\b" dist dist-accounts; then
            echo "::error::A build contains an administration screen or the name of an admin function, in the files listed above."
            exit 1
          fi

      # A build writes every VITE_* value the code reads into its files, so it
      # has to refuse a secret key outright (vite.config.ts). The value used
      # here is made up on the spot. It is not a key of any project.
      - name: A build that is given a secret key stops and writes nothing
        shell: bash
        run: |
          fake="sb_secret_$(printf 'x%.0s' {1..24})"
          if out="$(VITE_SUPABASE_URL=https://ci-placeholder.invalid VITE_SUPABASE_PUBLISHABLE_KEY="$fake" pnpm exec vite build --outDir dist-refused 2>&1)"; then
            echo "::error::A build went ahead with a secret key in VITE_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          printf '%s\n' "$out"
          if ! grep -q 'VITE_SUPABASE_PUBLISHABLE_KEY holds a Supabase secret key' <<<"$out"; then
            echo "::error::The build failed, but not because it refused the secret key."
            exit 1
          fi
          if grep -qF "$fake" <<<"$out"; then
            echo "::error::The refusal repeated the key it was given."
            exit 1
          fi
          if [ -e dist-refused ]; then
            echo "::error::The refused build still wrote files to dist-refused."
            exit 1
          fi

  supabase:
    name: Account backend (migrations · pgTAP · Edge Function)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      # Postgres, Auth, the API gateway, PostgREST, the mail catcher and the
      # edge runtime. Starting the stack applies every file in
      # supabase/migrations to an empty database.
      - name: Start the minimal local stack
        run: supabase start -x studio,postgres-meta,imgproxy,storage-api,realtime,logflare,vector,supavisor
      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Email templates carry a typed code, never a link
        run: |
          status=0
          for name in confirmation recovery invite magic_link email_change; do
            if [ ! -f "supabase/templates/$name.html" ]; then
              echo "::error::supabase/templates/$name.html is missing."
              status=1
            fi
          done
          for f in supabase/templates/*.html; do
            if grep -q 'ConfirmationURL' "$f"; then
              echo "::error file=$f::Scholea emails carry a code to type, never a link. Remove ConfirmationURL."
              status=1
            fi
            # password_changed.html only reports that something happened.
            # Every other template is an email with a code in it.
            if [ "$(basename "$f")" != "password_changed.html" ] && ! grep -qF '{{ .Token }}' "$f"; then
              echo "::error file=$f::This template must print {{ .Token }} for the person to type."
              status=1
            fi
          done
          exit "$status"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the Edge Function
        run: deno check --config supabase/functions/admin/deno.json supabase/functions/admin/index.ts

      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sign-up, password reset, invitations and every action of the admin
      # Edge Function, against the local Auth service, with codes read from
      # the local mail catcher.
      - name: End-to-end tests (local Auth, mail catcher, Edge Function)
        run: pnpm test:supabase

      - name: Service logs, when a step failed
        if: failure()
        run: |
          for c in supabase_db_scholea supabase_auth_scholea supabase_rest_scholea supabase_edge_runtime_scholea; do
            echo "::group::$c"
            docker logs --tail 150 "$c" 2>&1 || true
            echo "::endgroup::"
          done
