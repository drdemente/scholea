# Scholea — LOCAL development stack for the optional account backend.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# These values configure `supabase start` on a developer machine and in CI only.
# Do NOT `supabase config push` this file to a hosted project: it carries
# local-only limits and URLs. Hosted settings are listed in docs/deployment.md.
project_id = "scholea"

[api]
enabled = true
# Non-default port block (5632x) so this stack can run beside other local projects.
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# auto_expose_new_tables stays unset: every grant is explicit in migrations.

[api.tls]
enabled = false

[db]
port = 56322
shadow_port = 56320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 56329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Scholea does not use Realtime or Storage.
[realtime]
enabled = false

[storage]
enabled = false

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"

# Local mail catcher (Mailpit): every auth email lands here instead of being sent.
# Web UI and REST API on this port.
[local_smtp]
enabled = true
port = 56324

# Known limit: Scholea's own functions never say whether an address has an
# account, but Auth's public endpoints do (a sign-in code can be requested for
# an existing account only; sign-up and email change answer differently for a
# taken address; a suspended account answers "banned"). The database cannot
# change that. A hosted project keeps Auth's default rate limits, which slow
# the probing down. Its CAPTCHA protection must stay OFF for now: with it on,
# Auth refuses every sign-up, password sign-in and reset request that carries
# no CAPTCHA token, and the app does not send one (docs/deployment.md,
# section 4). supabase/functions/tests/auth-codes.e2e.test.ts pins each of
# the answers above.
[auth]
enabled = true
site_url = "http://localhost:5193"
additional_redirect_urls = [
  "http://127.0.0.1:5193",
  "tauri://localhost",
  "http://tauri.localhost",
  "https://tauri.localhost",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# Matches the app's "At least 10 characters" rule.
minimum_password_length = 10
password_requirements = ""

# Local-only limits, raised so the end-to-end tests are not throttled.
# A hosted project keeps its dashboard values.
[auth.rate_limit]
email_sent = 1000
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 300
token_verifications = 300
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Sign-up must be confirmed with the emailed code before the account can sign in.
enable_confirmations = true
secure_password_change = true
# Local only; a hosted project keeps 60s between emails to one address.
max_frequency = "1s"
# One-time codes are typed into the app (no links): 8 digits, valid for 24 hours.
otp_length = 8
otp_expiry = 86400

# Every template prints {{ .Token }} for the user to type; none contains a link.
# The same files are pasted into a hosted project's email templates.
[auth.email.template.confirmation]
subject = "Your Scholea confirmation code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your Scholea password reset code"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "Your Scholea invitation code"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your Scholea sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new Scholea email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Your Scholea password was changed"
# The CLI resolves notification paths from supabase/, template paths from the repo root.
content_path = "./templates/password_changed.html"

[auth.sms]
enable_signup = false
# Phone sign-up is off. Confirmations stay ON because Auth only hides "this
# email already has an account" from sign-up when no provider auto-confirms.
enable_confirmations = true
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8283
deno_version = 2

# The one Edge Function: the account actions that need the Auth admin API.
# The gateway refuses a request without a valid token before the function runs;
# the function then lets the database decide what the caller may do.
[functions.admin]
verify_jwt = true

# Logflare bind-mounts the Docker socket, which is unreliable under colima.
[analytics]
enabled = false
port = 56327
backend = "postgres"
