<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#1a1a1a;background:#ffffff;">
    <h1 style="font-size:20px;margin:0 0 16px;">Confirm your Scholea account</h1>
    <p>Enter this code in Scholea to confirm {{ .Email }}:</p>
    <p style="font-family:'Courier New',Courier,monospace;font-size:28px;font-weight:bold;letter-spacing:4px;margin:16px 0;">{{ .Token }}</p>
    <p>The code expires in 24 hours and can be used once. Scholea will never ask you to click a link to confirm it.</p>
    <p>If you did not create a Scholea account, you can ignore this email.</p>
  </body>
</html>
